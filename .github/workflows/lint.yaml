---
name: lint
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: '.go-version'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6.5.2
        with:
          version: latest
