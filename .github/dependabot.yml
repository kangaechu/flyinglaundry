---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: "weekly"
    groups:
      minor-patch-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: "gomod"
    directory: "/"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: "weekly"
    groups:
      minor-patch-dependencies:
        update-types:
          - minor
          - patch
